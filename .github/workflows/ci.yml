name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 语法检查（所有 JS）
        run: |
          node --check game.js
          node --check minigames.js
          node --check flow.js
          node --check sync.js
          node --check server.js
          node --input-type=module --check < src/worker.js

      - name: 防回归：index.html 不得静态引用游戏脚本（由 sync.js 按序注入）
        run: |
          ! grep -q '<script src="game.js' index.html
          ! grep -q '<script src="minigames.js' index.html
          ! grep -q '<script src="flow.js' index.html

      - name: 词库结构校验
        run: python3 validate_data.py

      - name: 启动冒烟测试（正常场景）
        run: node smoke_boot.js

      - name: 启动冒烟测试（模拟页面元素缺失，验证启动不中断）
        run: SIMULATE_MISSING=set-export,set-import,btn-settings node smoke_boot.js

      - name: Worker 接口契约测试（内存 KV 模拟）
        run: node test_worker.mjs

      # 推送后等 Cloudflare 重新部署，再从 GitHub 网络（无污染）探测线上站点。
      # Cloudflare 构建耗时不可控，失败不阻塞 CI，仅作提示。
      - name: 线上健康检查（提示性，不阻塞）
        continue-on-error: true
        run: |
          sleep 100
          curl -sf --max-time 20 https://word-adventure.xiaolu-pan.workers.dev/ | grep -q "单词冒险岛" && echo "✓ 首页可达"
          curl -s --max-time 20 https://word-adventure.xiaolu-pan.workers.dev/api/progress/0000 | grep -q "no_save" && echo "✓ 同步 API 正常（404 no_save 为预期）"
