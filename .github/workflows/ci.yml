name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 语法检查（所有 JS）
        run: |
          node --check game.js
          node --check minigames.js
          node --check flow.js
          node --check sync.js
          node --check server.js
          node --input-type=module --check < "functions/api/progress/[code].js"

      - name: 防回归：index.html 不得静态引用游戏脚本（由 sync.js 按序注入）
        run: |
          ! grep -q '<script src="game.js' index.html
          ! grep -q '<script src="minigames.js' index.html
          ! grep -q '<script src="flow.js' index.html

      - name: 词库结构校验
        run: python3 validate_data.py

      - name: 启动冒烟测试（正常场景）
        run: node smoke_boot.js

      - name: 启动冒烟测试（模拟页面元素缺失，验证启动不中断）
        run: SIMULATE_MISSING=set-export,set-import,btn-settings node smoke_boot.js
